<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commission Settings | KalaKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body class="kk-page"><main class="container py-4"><a href="admin-dashboard.html" class="kk-brand text-decoration-none">कला<span>Kart</span></a><h3 class="my-4">Commission Settings</h3><div class="kk-panel p-4"><label class="form-label">Marketplace commission (%)</label><input id="commission" class="form-control bg-dark text-light border-secondary" type="number" value="10" min="0" max="100"><button class="btn btn-warning mt-3" onclick="save()">Save Settings</button><div id="msg" class="text-success mt-3"></div></div></main><script>function save(){localStorage.setItem('kkCommission',document.getElementById('commission').value);document.getElementById('msg').textContent='Commission setting saved in demo mode.'}</script></body></html>
