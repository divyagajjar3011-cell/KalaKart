<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Categories | KalaKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body class="kk-page"><main class="container py-4"><a href="admin-dashboard.html" class="kk-brand text-decoration-none">कला<span>Kart</span></a><div class="d-flex justify-content-between align-items-center my-4"><h3>Manage Categories</h3><button class="btn btn-warning" onclick="addCategory()">+ Add Category</button></div><div class="kk-panel p-4"><div class="row g-3" id="cats"></div></div></main><script>const c=['Resin Art','Candle Art','Crochet Handmade','Glass Décor','Handwork Dress','Handwork Shirt','Customized T-Shirt','Men’s Kurta','Chaniya Choli','Customized Hankey','Handmade Home Décor','Customized Gifts'];document.getElementById('cats').innerHTML=c.map((x,i)=>`<div class="col-md-4"><div class="p-3 border rounded-3" style="border-color:rgba(213,173,104,.2)!important">${i+1}. ${x}</div></div>`).join('');function addCategory(){const n=prompt('Category name:');if(n)document.getElementById('cats').insertAdjacentHTML('beforeend',`<div class="col-md-4"><div class="p-3 border rounded-3">${n}</div></div>`);}</script></body></html>
