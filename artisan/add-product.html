<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product | KalaKart</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>.form-wrap{max-width:900px;margin:auto}.panel{background:var(--card);border:1px solid rgba(213,173,104,.16);border-radius:26px;padding:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:18px}.field label{display:block;color:var(--ivory);font-size:13px;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;background:#120d0a;border:1px solid rgba(213,173,104,.22);border-radius:12px;padding:13px 14px;color:var(--ivory);outline:none}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.full{grid-column:1/-1}.notice{display:none;padding:12px 15px;border-radius:12px;background:rgba(80,170,110,.12);border:1px solid rgba(80,170,110,.3);color:#d7f1dc;margin-bottom:20px}.notice.show{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><nav class="main-nav"><a href="artisan-dashboard.html">Dashboard</a><a href="manage-products.html">Products</a><a href="artisan-orders.html">Orders</a></nav></div></header><main class="section"><div class="container form-wrap"><span class="eyebrow">PRODUCT LISTING</span><h1 style="font-family:var(--serif);font-size:56px;margin:10px 0 8px">Add your <em style="color:var(--gold)">handmade piece.</em></h1><p style="color:var(--muted);margin-bottom:28px">Create a demo listing now. Later this form will send the data to the Spring Boot API.</p><div class="panel"><div id="notice" class="notice"></div><form id="productForm"><div class="grid"><div class="field"><label>Product Name *</label><input name="name" required placeholder="e.g. Hand-Poured Lavender Candle"></div><div class="field"><label>Category *</label><select name="category" required><option value="">Choose category</option><option>Resin Art</option><option>Candle Art</option><option>Crochet Handmade</option><option>Glass Décor</option><option>Handmade Home Décor</option><option>Handwork Dress</option><option>Handwork Shirt</option><option>Customized T-Shirt</option><option>Men's Handwork Kurta</option><option>Chaniya Choli</option><option>Customized Hankey</option><option>Customized Gifts</option></select></div><div class="field"><label>Price (₹) *</label><input name="price" type="number" min="1" required placeholder="499"></div><div class="field"><label>Stock *</label><input name="stock" type="number" min="0" required placeholder="10"></div><div class="field"><label>Product Image</label><input name="image" type="url" placeholder="Paste image URL (optional)"></div><div class="field"><label>Artisan / Brand Name</label><input name="artisan" placeholder="Your craft name"></div><div class="field full"><label>Description</label><textarea name="description" placeholder="Tell customers what makes this handmade product special..."></textarea></div></div><button class="btn-gold" type="submit"><i class="bi bi-plus-lg"></i> Publish Product</button><a href="manage-products.html" style="margin-left:12px;color:var(--muted)">View my products</a></form></div></div></main><script src="../js/artisan.js"></script><script>document.getElementById('productForm').addEventListener('submit',function(e){e.preventDefault();const d=Object.fromEntries(new FormData(this).entries());const p=KalaArtisan.get();p.unshift({id:'A'+String(Date.now()).slice(-5),name:d.name,category:d.category,price:Number(d.price),stock:Number(d.stock),artisan:d.artisan||'KalaKart Artisan',image:d.image||'../assets/images/kalakart-craft.png',description:d.description||'Handmade product by a local KalaKart artisan.',status:'Pending'});KalaArtisan.save(p);const n=document.getElementById('notice');n.textContent='Product added successfully and sent for admin review.';n.classList.add('show');this.reset();});</script></body></html>
