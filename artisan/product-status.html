<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Status | KalaKart</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>.box{max-width:760px;margin:auto;background:var(--card);border:1px solid rgba(213,173,104,.16);border-radius:28px;padding:32px}.preview{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center}.preview img{width:180px;height:180px;object-fit:cover;border-radius:18px;border:1px solid rgba(213,173,104,.2)}.pill{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid rgba(213,173,104,.25);color:var(--gold);font-size:12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.info div{padding:15px;background:#120d0a;border-radius:14px}.info span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.info strong{font-size:16px}@media(max-width:650px){.preview{grid-template-columns:1fr}.preview img{width:100%;height:240px}.info{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><nav class="main-nav"><a href="artisan-dashboard.html">Dashboard</a><a href="manage-products.html">Products</a></nav></div></header><main class="section"><div class="container"><span class="eyebrow">PRODUCT REVIEW</span><div class="box" id="box"></div></div></main><script src="../js/artisan.js"></script><script>const id=new URLSearchParams(location.search).get('id');const x=KalaArtisan.get().find(p=>p.id===id);const box=document.getElementById('box');if(!x){box.innerHTML='<h2>Product not found</h2><a class="btn-gold" href="manage-products.html">Back to Products</a>';}else{box.innerHTML=`<div class="preview"><img src="${x.image}" alt="${x.name}"><div><span class="pill">${x.status}</span><h1 style="font-family:var(--serif);font-size:42px;margin:12px 0">${x.name}</h1><p style="color:var(--muted)">${x.description||''}</p></div></div><div class="info"><div><span>Category</span><strong>${x.category}</strong></div><div><span>Price</span><strong>₹${Number(x.price).toLocaleString('en-IN')}</strong></div><div><span>Available Stock</span><strong>${x.stock}</strong></div><div><span>Listing ID</span><strong>${x.id}</strong></div></div><div style="margin-top:28px"><a class="btn-gold" href="manage-products.html">Back to Products</a></div>`;}</script></body></html>
