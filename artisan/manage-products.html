<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Products | KalaKart</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:25px 0}.table-wrap{overflow:auto;background:var(--card);border:1px solid rgba(213,173,104,.16);border-radius:22px}.table{width:100%;min-width:780px;border-collapse:collapse}.table th,.table td{padding:17px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}.table th{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.table td{color:var(--ivory);font-size:14px}.muted{color:var(--muted)}.status{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;border:1px solid rgba(213,173,104,.2)}.approved{color:#bde8c8;background:rgba(70,150,90,.1)}.pending{color:#f2d39a;background:rgba(213,173,104,.1)}.actions a{color:var(--gold);margin-right:12px}.empty{padding:45px;text-align:center;color:var(--muted)}
</style></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><nav class="main-nav"><a href="artisan-dashboard.html">Dashboard</a><a class="active" href="manage-products.html">Products</a><a href="artisan-orders.html">Orders</a></nav></div></header><main class="section"><div class="container"><span class="eyebrow">MY CATALOGUE</span><div class="toolbar"><div><h1 style="font-family:var(--serif);font-size:54px;margin:8px 0">Manage <em style="color:var(--gold)">Products.</em></h1><p class="muted">Edit your demo catalogue before it connects to the backend.</p></div><a class="btn-gold" href="add-product.html"><i class="bi bi-plus-lg"></i> Add Product</a></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="../js/artisan.js"></script><script>const rows=document.getElementById('rows');const p=KalaArtisan.get();if(!p.length){rows.innerHTML='<tr><td colspan="6"><div class="empty">No products yet. Add your first handmade product.</div></td></tr>';}else{rows.innerHTML=p.map(x=>`<tr><td><strong>${x.name}</strong><br><span class="muted">${x.artisan||'KalaKart Artisan'}</span></td><td>${x.category}</td><td>₹${Number(x.price).toLocaleString('en-IN')}</td><td>${x.stock}</td><td><span class="status ${x.status==='Approved'?'approved':'pending'}">${x.status}</span></td><td class="actions"><a href="product-status.html?id=${encodeURIComponent(x.id)}">View</a><a href="#" onclick="removeProduct('${x.id}');return false">Remove</a></td></tr>`).join('');}function removeProduct(id){if(confirm('Remove this product from your demo catalogue?')){KalaArtisan.save(KalaArtisan.get().filter(x=>x.id!==id));location.reload();}}</script></body></html>
