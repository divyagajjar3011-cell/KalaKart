<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Details | KalaKart"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><style>.detail{padding:130px 0 90px}.detail-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}.detail-image{aspect-ratio:1/1;overflow:hidden;background:#2b2019;border:1px solid rgba(213,173,104,.15)}.detail-image img{width:100%;height:100%;object-fit:cover}.detail-copy h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.8rem,5vw,5rem);line-height:.95;margin:10px 0 18px}.detail-copy h1 em{color:#d5ad68}.detail-copy .artisan{color:#d5ad68}.detail-price{font-size:2rem;color:#f5efe6;margin:22px 0}.detail-description{color:#bdb4aa;line-height:1.8;max-width:650px}.detail-meta{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.meta-pill{border:1px solid rgba(213,173,104,.2);border-radius:999px;padding:9px 14px;color:#bdb4aa}.buy-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.buy-row .btn-kala{min-width:180px;text-align:center}@media(max-width:800px){.detail-grid{grid-template-columns:1fr;gap:35px}.detail{padding-top:95px}}.clothing-note{margin:22px 0;padding:14px 16px;border:1px solid rgba(213,173,104,.28);background:rgba(213,173,104,.06);color:#c9c0b8;font-size:12px;line-height:1.6;display:flex;gap:10px}.clothing-note i{color:#d5ad68;font-size:16px}.custom-message{margin:20px 0}.custom-message label{display:block;color:#f5efe6;font-size:12px;margin-bottom:8px;letter-spacing:.04em}.custom-message textarea{width:100%;background:#120d0a;color:#f5efe6;border:1px solid rgba(213,173,104,.28);padding:12px 14px;resize:vertical;outline:none}.custom-message textarea:focus{border-color:#d5ad68}.custom-message small{display:block;color:#8f877f;margin-top:6px;font-size:10px}</style></head>
<body>
<header class="site-header"><div class="container-fluid nav-wrap"><a class="brand" href="index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a class="active" href="products.html">Products</a><a href="artisan-store.html">Artisans</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><button class="icon-btn" id="searchBtn"><i class="bi bi-search"></i></button><a class="icon-btn" href="customer/wishlist.html"><i class="bi bi-heart"></i></a><a class="icon-btn" href="auth/login.html"><i class="bi bi-person"></i></a><a class="bag-btn" href="customer/cart.html"><i class="bi bi-bag"></i><span id="cartCount">0</span></a></div></div></header>
<main><section class="detail"><div class="container" id="detailRoot"></div></section></main>
<footer class="site-footer"><div class="footer-bottom container"><span>© 2026 KalaKart. Crafted with care.</span><span>Handmade · Local · Original</span></div></footer>
<div class="toast" id="toast" hidden><i class="bi bi-check2"></i><span id="toastText">Added to bag</span></div>
<script src="js/main.js"></script><script src="js/cart.js"></script><script src="js/products.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id')||1); const p=KALAKART_PRODUCTS.find(x=>x.id===id)||KALAKART_PRODUCTS[0];
const clothingCategories=['Handwork Dress','Handwork Shirt','Customized T-Shirt',"Men's Handwork Kurta",'Chaniya Choli'];
const clothingNote=clothingCategories.includes(p.category)?`<div class="clothing-note"><i class="bi bi-info-circle"></i><span><strong>Important:</strong> Please provide your own clothes/garment. We only add the handwork/customization and return the finished piece.</span></div>`:'';
const messageBox=p.category==='Customized T-Shirt'?`<div class="custom-message"><label for="customMessage">Customized Message</label><textarea id="customMessage" rows=4 maxlength=120 placeholder="Write the message/name/quote you want on the T-shirt..."></textarea><small>Maximum 120 characters.</small></div>`:'';
document.getElementById('detailRoot').innerHTML=`<div class="detail-grid"><div class="detail-image"><img src="${p.image}" alt="${p.name}"></div><div class="detail-copy"><span class="eyebrow">${p.category.toUpperCase()}</span><h1>${p.name.split(' ').slice(0,2).join(' ')} <em>${p.name.split(' ').slice(2).join(' ')}</em></h1><p class="artisan">Handcrafted by ${p.artisan}</p><div class="detail-price">₹${p.price.toLocaleString('en-IN')}</div><p class="detail-description">A thoughtfully handmade piece created by a KalaKart artisan. Every detail is crafted with care, making it a meaningful addition to your home, wardrobe or gifting collection.</p>${clothingNote}${messageBox}<div class="detail-meta"><span class="meta-pill"><i class="bi bi-star-fill"></i> ${p.rating} rating</span><span class="meta-pill"><i class="bi bi-hand-index-thumb"></i> Handmade</span><span class="meta-pill"><i class="bi bi-patch-check"></i> Artisan made</span></div><div class="buy-row"><button class="btn-kala btn-gold" id="detailAdd">Add to bag <i class="bi bi-bag"></i></button><a class="btn-kala btn-outline-gold" href="customer/checkout.html">Buy now <i class="bi bi-arrow-up-right"></i></a></div></div></div>`;
document.getElementById('detailAdd').addEventListener('click',()=>{const message=document.getElementById('customMessage')?.value.trim()||'';addKalaProduct(p,1,message);const t=document.getElementById('toast');document.getElementById('toastText').textContent=message?`${p.name} added with your message`:`${p.name} added to bag`;t.hidden=false;setTimeout(()=>t.hidden=true,2200);});
</script></body></html>
