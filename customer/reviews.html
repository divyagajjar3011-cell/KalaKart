<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews | KalaKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><nav class="main-nav"><a href="../index.html">Home</a><a href="../products.html">Products</a><a class="active" href="customer-dashboard.html">Dashboard</a></nav><div class="nav-actions"><a class="icon-btn" href="cart.html"><i class="bi bi-bag"></i></a></div></div></header><main class="section"><div class="container"><span class="eyebrow">YOUR VOICE</span><h1 class="page-title">Write a Review</h1><div class="auth-card" style="max-width:700px"><form id="reviewForm"><label>Product</label><input class="form-control" value="Resin Art Memory Tray" readonly><label>Rating</label><select class="form-select" required><option value="">Choose rating</option><option>5 — Loved it</option><option>4 — Great</option><option>3 — Good</option><option>2 — Okay</option><option>1 — Needs improvement</option></select><label>Your review</label><textarea class="form-control" rows="5" required placeholder="Tell others about your handmade product..."></textarea><button class="gold-btn" type="submit">Submit Review</button><div id="reviewMessage" class="form-message"></div></form></div></div></main><script>document.getElementById('reviewForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('reviewMessage').textContent='Thank you! Your review was saved in demo mode.';document.getElementById('reviewMessage').classList.add('show');});</script></body></html>
