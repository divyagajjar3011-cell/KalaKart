<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your Bag | KalaKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet">
<style>
.cart-page{padding:120px 0 90px}.cart-layout{display:grid;grid-template-columns:1.55fr .75fr;gap:28px}.cart-panel,.summary{background:#1d1511;border:1px solid rgba(213,173,104,.18);border-radius:2px}.cart-panel{padding:26px}.cart-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(213,173,104,.12);padding-bottom:18px;margin-bottom:5px}.cart-head h1,.summary h2{font-family:'Cormorant Garamond',Georgia,serif;margin:0}.cart-head h1{font-size:48px}.cart-item{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid rgba(213,173,104,.1)}.cart-img{width:110px;height:130px;object-fit:cover;background:#2b2019}.cart-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:25px}.cart-meta{color:#8f877f;font-size:10px;margin:5px 0 12px}.qty{display:flex;align-items:center;border:1px solid rgba(213,173,104,.25);width:max-content}.qty button{width:34px;height:32px}.qty span{width:34px;text-align:center;font-size:11px}.remove{font-size:10px;color:#8f877f;margin-top:10px}.remove:hover{color:#d5ad68}.item-price{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px}.summary{padding:28px;position:sticky;top:100px;height:max-content}.summary h2{font-size:38px;margin-bottom:22px}.line{display:flex;justify-content:space-between;color:#aaa099;font-size:11px;margin:13px 0}.line.total{border-top:1px solid rgba(213,173,104,.18);padding-top:18px;color:#f5efe6;font-size:14px}.empty-cart{text-align:center;padding:55px 20px;color:#9e958d}.empty-cart i{font-size:45px;color:#d5ad68}.empty-cart h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;color:#f5efe6}.cart-custom{font-size:10px;color:#c9c0b8;border-left:2px solid #d5ad68;padding-left:9px;margin:8px 0 10px;line-height:1.5}.secure-note{font-size:9px;color:#857d76;line-height:1.7;margin-top:18px}@media(max-width:850px){.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-item{grid-template-columns:82px 1fr}.item-price{grid-column:2}.cart-img{width:82px;height:105px}}@media(max-width:480px){.cart-page{padding:95px 15px 60px}.cart-panel,.summary{padding:18px}.cart-head h1{font-size:39px}.cart-item{gap:12px}.cart-name{font-size:21px}}
</style></head>
<body>
<header class="site-header"><div class="container-fluid nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><button class="mobile-menu" id="mobileMenu"><i class="bi bi-list"></i></button><nav class="main-nav" id="mainNav"><a href="../index.html">Home</a><a href="../products.html">Products</a><a href="../artisan-store.html">Artisans</a><a href="../about.html">About</a><a href="../contact.html">Contact</a></nav><div class="nav-actions"><a class="icon-btn" href="../auth/login.html"><i class="bi bi-person"></i></a><a class="bag-btn" href="cart.html"><i class="bi bi-bag"></i><span id="cartCount">0</span></a></div></div></header>
<main class="cart-page"><div class="container"><span class="eyebrow">YOUR KALAKART BAG</span><div class="cart-layout mt-3"><section class="cart-panel"><div class="cart-head"><h1>Your Bag</h1><span id="itemCount" class="result-count"></span></div><div id="cartItems"></div></section><aside class="summary"><h2>Order Summary</h2><div class="line"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="line"><span>Delivery</span><strong id="delivery">₹0</strong></div><div class="line total"><span>Total</span><strong id="total">₹0</strong></div><a id="checkoutBtn" class="btn-kala btn-gold w-100 justify-content-center mt-3" href="checkout.html">Proceed to checkout <i class="bi bi-arrow-right"></i></a><p class="secure-note"><i class="bi bi-shield-check"></i> Demo checkout for college project. Payment is not connected to a real gateway.</p></aside></div></div></main>
<footer class="site-footer"><div class="footer-bottom container"><span>© 2026 KalaKart. Crafted with care.</span><span>Handmade · Local · Original</span></div></footer>
<script src="../js/main.js"></script><script src="../js/cart.js"></script><script src="../js/products.js"></script><script>
function renderCart(){const cart=getKalaCart(), root=document.getElementById('cartItems');document.getElementById('itemCount').textContent=`${cart.reduce((s,p)=>s+p.qty,0)} item(s)`; if(!cart.length){root.innerHTML='<div class="empty-cart"><i class="bi bi-bag"></i><h2>Your bag is waiting</h2><p>Discover something handmade and meaningful.</p><a class="btn-kala btn-outline-gold" href="../products.html">Explore products</a></div>';document.getElementById('checkoutBtn').classList.add('disabled');}else{root.innerHTML=cart.map(p=>{const current=(window.KALAKART_PRODUCTS||[]).find(x=>x.id===p.id)|| (window.KALAKART_PRODUCTS||[]).find(x=>x.category===p.category); const image=current?.image || p.image || '../assets/images/kalakart-craft.png'; return `<div class="cart-item"><img class="cart-img" src="${image}" alt="${p.name}" onerror="this.onerror=null;this.src='../assets/images/kalakart-craft.png'"><div><div class="cart-name">${p.name}</div><div class="cart-meta">By ${p.artisan} · ${p.category}</div>${p.customMessage?`<div class="cart-custom"><strong>Message:</strong> ${p.customMessage}</div>`:``}<div class="qty"><button type="button" onclick="changeQty(${p.id},-1)" aria-label="Decrease quantity"><i class="bi bi-dash"></i></button><span>${p.qty}</span><button type="button" onclick="changeQty(${p.id},1)" aria-label="Increase quantity"><i class="bi bi-plus"></i></button></div><button type="button" class="remove" onclick="removeItem(${p.id})">Remove</button></div><div class="item-price">${kalaMoney(p.price*p.qty)}</div></div>`;}).join('');}const t=kalaCartTotals();document.getElementById('subtotal').textContent=kalaMoney(t.subtotal);document.getElementById('delivery').textContent=t.delivery?'₹79':'FREE';document.getElementById('total').textContent=kalaMoney(t.total);}
function changeQty(id,d){const item=getKalaCart().find(x=>x.id===id);if(item) updateKalaQty(id,item.qty+d);renderCart();}
function removeItem(id){removeKalaProduct(id);renderCart();}
renderCart();
</script></body></html>
