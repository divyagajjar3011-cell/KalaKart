<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | KalaKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><header class="site-header"><div class="nav-wrap"><a class="brand" href="../index.html"><span class="brand-kala">कला</span><span class="brand-kart">Kart</span></a><nav class="main-nav"><a href="../index.html">Home</a><a href="../products.html">Products</a><a class="active" href="customer-dashboard.html">Dashboard</a></nav><div class="nav-actions"><a class="icon-btn" href="cart.html"><i class="bi bi-bag"></i></a></div></div></header><main class="section"><div class="container"><span class="eyebrow">SAVED FOR LATER</span><h1 class="page-title">My Wishlist</h1><div id="wishlistGrid" class="product-grid"></div><div id="emptyWishlist" class="category-card" style="display:none"><div><h3>Your wishlist is waiting.</h3><p class="muted">Save handmade pieces you love and come back to them anytime.</p><a class="gold-btn" href="../products.html">Explore Products</a></div></div></div></main><script src="../js/products.js"></script><script src="../js/main.js"></script><script>const grid=document.getElementById('wishlistGrid'),empty=document.getElementById('emptyWishlist');const saved=JSON.parse(localStorage.getItem('kalakartWishlist')||'[]');const items=(window.KALAKART_PRODUCTS||[]).filter(p=>saved.includes(p.id));if(!items.length){grid.style.display='none';empty.style.display='block'}else{grid.innerHTML=items.map(p=>`<article class="product-card"><div class="product-image"><img src="${p.image}" alt="${p.name}"></div><div class="product-info"><span class="eyebrow">${p.category}</span><h3>${p.name}</h3><p class="muted">${p.artisan}</p><strong>₹${p.price}</strong><div style="margin-top:14px"><a class="gold-btn" href="../product-details.html?id=${p.id}">View Product</a></div></div></article>`).join('')}</script></body></html>
